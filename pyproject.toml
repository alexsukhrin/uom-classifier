[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uom-classifier"
version = "0.1.0"
description = "Tiny dependency-free classifier that maps noisy OCR'd Ukrainian unit-of-measure strings to canonical units"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alexandr Sukhrin" }]
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Natural Language :: Ukrainian",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
train = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/alexsukhrin/uom-classifier"

[tool.hatch.build.targets.wheel]
packages = ["src/uom_classifier"]
